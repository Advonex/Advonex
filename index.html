<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Advonex</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:wght@500;600;700&display=swap">
<style>
/* Layout concept: sticky navy header with role switch, full-width views inside a 1180px wrap; navy hero band, gold used only for emphasis and tier marks. */
:root{
  --bg:#ffffff; --surface:#F4F6FA; --surface2:#E8EDF5; --fg:#0E1B33; --muted:#566379; --line:#D9DFEA;
  --navy:#12284C; --navy-ink:#ffffff; --gold:#B4872A; --gold-ink:#7A5A10; --gold-soft:#FBF1D6;
  --good:#1E7A58; --bad:#B23A2B; --warn:#A8620F;
  --hero1:#0C1D3C; --hero2:#17325F; --hero-ink:#F3F6FB; --hero-muted:#B5C2D9; --hero-gold:#E3BD68;
  --t-gold-bg:#FBF1D4; --t-gold-fg:#7A5A0B; --t-gold-bd:#E3C26A;
  --t-plat-bg:#E8ECF2; --t-plat-fg:#37445A; --t-plat-bd:#B2BCCB;
  --t-dia-bg:#DDF0FA; --t-dia-fg:#0A5878; --t-dia-bd:#79C2E2;
  --t-elite-bg:#0B1A38; --t-elite-fg:#F3D78F; --t-elite-bd:#D4A64A;
  --shadow:0 1px 2px rgba(14,27,51,.06),0 8px 24px rgba(14,27,51,.07);
  --serif:'Source Serif 4',Georgia,'Times New Roman',serif; --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1426; --surface:#101F38; --surface2:#162A4A; --fg:#E7ECF5; --muted:#98A6BD; --line:#243659;
  --navy:#2B4F8F; --gold:#D6A94C; --gold-ink:#E8C374; --gold-soft:#2E2510; --good:#46C493; --bad:#F0806F; --warn:#E6A257;
  --t-gold-bg:#33290E; --t-gold-fg:#EBCB7A; --t-gold-bd:#8A6D20;
  --t-plat-bg:#26324A; --t-plat-fg:#D3DBE8; --t-plat-bd:#55647F;
  --t-dia-bg:#0E3550; --t-dia-fg:#8FD8F6; --t-dia-bd:#2C7BA3;
  --t-elite-bg:#060F22; --t-elite-fg:#F3D78F; --t-elite-bd:#D4A64A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1426; --surface:#101F38; --surface2:#162A4A; --fg:#E7ECF5; --muted:#98A6BD; --line:#243659;
  --navy:#2B4F8F; --gold:#D6A94C; --gold-ink:#E8C374; --gold-soft:#2E2510; --good:#46C493; --bad:#F0806F; --warn:#E6A257;
  --t-gold-bg:#33290E; --t-gold-fg:#EBCB7A; --t-gold-bd:#8A6D20;
  --t-plat-bg:#26324A; --t-plat-fg:#D3DBE8; --t-plat-bd:#55647F;
  --t-dia-bg:#0E3550; --t-dia-fg:#8FD8F6; --t-dia-bd:#2C7BA3;
  --t-elite-bg:#060F22; --t-elite-fg:#F3D78F; --t-elite-bd:#D4A64A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.55;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hero1);z-index:30}
h1,h2,h3,h4{font-family:var(--serif);font-weight:600;line-height:1.2;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hide{display:none!important}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px}
i[data-lucide]{display:inline-block;width:1em;height:1em}
svg.lucide{width:1.1em;height:1.1em;vertical-align:-.17em;stroke-width:2}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--hero1);color:var(--hero-ink);border-bottom:1px solid rgba(255,255,255,.08)}
.bar{display:flex;align-items:center;gap:12px 20px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--serif);font-weight:700;font-size:20px;letter-spacing:-.01em}
.mark{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;background:var(--hero-gold);color:#0C1D3C}
nav{display:flex;gap:2px;overflow-x:auto;order:3;flex:1 0 100%;scrollbar-width:none;padding-bottom:2px}
nav::-webkit-scrollbar{display:none}
nav a{white-space:nowrap;text-decoration:none;padding:7px 12px;border-radius:8px;color:var(--hero-muted);font-weight:500;font-size:14px;display:flex;gap:6px;align-items:center}
nav a:hover{color:#fff;background:rgba(255,255,255,.07)}
nav a[aria-current="page"]{color:#0C1D3C;background:var(--hero-gold)}
.seg{display:flex;background:rgba(255,255,255,.08);border-radius:10px;padding:3px;margin-left:auto}
.seg button{border:0;background:transparent;color:var(--hero-muted);padding:6px 12px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500}
.seg button[aria-pressed="true"]{background:#fff;color:#0C1D3C}
@media(min-width:900px){nav{order:0;flex:1 1 auto}.seg{margin-left:0}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-weight:500;text-decoration:none;font-size:14px;line-height:1.2}
.btn:hover{background:var(--surface)}
.btn-primary{background:var(--navy);color:var(--navy-ink);border-color:transparent}
.btn-primary:hover{background:var(--navy);filter:brightness(1.12)}
.btn-gold{background:var(--hero-gold);color:#0C1D3C;border-color:transparent;font-weight:600}
.btn-gold:hover{background:var(--hero-gold);filter:brightness(1.06)}
.btn-sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* hero */
.hero{background:linear-gradient(160deg,var(--hero1),var(--hero2));color:var(--hero-ink)}
.hero .wrap{padding-block:56px 44px}
.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:12px;font-weight:600;color:var(--hero-gold)}
.hero h1{font-size:clamp(30px,5vw,50px);max-width:820px;margin-top:12px}
.hero h1 em{font-style:normal;color:var(--hero-gold)}
.hero p.lead{color:var(--hero-muted);max-width:620px;margin-top:16px;font-size:17px}
.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:32px}
.act{display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:12px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);color:#fff;text-decoration:none;font-weight:500;cursor:pointer;text-align:left;font-size:15px}
.act:hover{background:rgba(255,255,255,.13)}
.act .ic{width:36px;height:36px;border-radius:9px;background:var(--hero-gold);color:#0C1D3C;display:grid;place-items:center;flex:none}
.act.primary{background:var(--hero-gold);color:#0C1D3C;border-color:transparent}
.act.primary .ic{background:#0C1D3C;color:var(--hero-gold)}

/* sections */
section.blk{padding-block:44px}
.sec-h{display:flex;flex-direction:column;gap:6px;margin-bottom:22px}
.sec-h h2{font-size:clamp(22px,3vw,30px)}
.sec-h p{color:var(--muted);max-width:680px}
.page-h{padding-block:28px 8px}
.page-h h1{font-size:clamp(26px,4vw,36px)}
.page-h p{color:var(--muted);margin-top:6px;max-width:700px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:18px}
.card.raised{box-shadow:var(--shadow)}
.surface{background:var(--surface);border-radius:14px;padding:18px}

/* tier */
.tier{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 8px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid;white-space:nowrap}
.t-gold{background:var(--t-gold-bg);color:var(--t-gold-fg);border-color:var(--t-gold-bd)}
.t-platinum{background:var(--t-plat-bg);color:var(--t-plat-fg);border-color:var(--t-plat-bd)}
.t-diamond{background:var(--t-dia-bg);color:var(--t-dia-fg);border-color:var(--t-dia-bd)}
.t-elite{background:var(--t-elite-bg);color:var(--t-elite-fg);border-color:var(--t-elite-bd)}
.tcard{display:flex;flex-direction:column;gap:10px;border-top:4px solid}
.tcard.t-gold{border-top-color:var(--t-gold-bd)} .tcard.t-platinum{border-top-color:var(--t-plat-bd)}
.tcard.t-diamond{border-top-color:var(--t-dia-bd)} .tcard.t-elite{border-top-color:var(--t-elite-bd)}
.tcard{background:var(--bg);color:var(--fg)}
.tcard ul{margin:0;padding-left:18px;color:var(--muted);font-size:14px;display:grid;gap:4px}
.tcard .yrs{font-family:var(--serif);font-size:26px;font-weight:600}

/* forms */
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:500;color:var(--muted);min-width:0}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--fg);font-size:14px;min-width:0}
textarea{resize:vertical;min-height:70px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.fgrid .full{grid-column:1/-1}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}

/* chips/tabs */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--bg);cursor:pointer;font-size:13px;font-weight:500;display:inline-flex;gap:6px;align-items:center}
.chip:hover{background:var(--surface)}
.chip[aria-pressed="true"]{background:var(--navy);color:var(--navy-ink);border-color:transparent}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface2);color:var(--muted)}
.pill.good{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.pill.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}

/* lawyer card */
.lcard{display:flex;flex-direction:column;gap:12px;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.lhead{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.lwho{display:flex;gap:11px;min-width:0}
.av{width:42px;height:42px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-weight:600;font-size:14px;flex:none;color:var(--fg)}
.lwho h3{font-size:17px}
.lwho .bci{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:9px 14px;margin:0;font-size:13px}
.facts dt{color:var(--muted);font-size:12px}
.facts dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.bar-s{height:6px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar-s span{display:block;height:100%;background:var(--gold)}
.lfoot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto;flex-wrap:wrap}
.fee{font-family:var(--serif);font-size:19px;font-weight:600}
.num{font-variant-numeric:tabular-nums}

/* chat */
.chatwrap{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@media(min-width:960px){.chatwrap{grid-template-columns:minmax(0,1fr) 310px}}
.chat{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--bg);min-height:520px}
.log{flex:1;padding:16px;display:flex;flex-direction:column;gap:14px;max-height:640px;overflow-y:auto}
.msg{max-width:min(100%,680px);padding:12px 14px;border-radius:14px;min-width:0;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:var(--navy);color:var(--navy-ink);border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:var(--surface);border-bottom-left-radius:4px;display:flex;flex-direction:column;gap:10px;width:100%}
.msg.bot ul{margin:0;padding-left:18px;display:grid;gap:3px}
.msg h4{font-size:15px}
.composer{display:flex;gap:10px;padding:12px;border-top:1px solid var(--line);align-items:flex-end}
.composer textarea{min-height:44px;max-height:140px}
.mcard{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.mcard .top2{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.rank{width:24px;height:24px;border-radius:50%;background:var(--gold);color:#0C1D3C;font-weight:700;font-size:12px;display:inline-grid;place-items:center;margin-right:8px}
.mcard ul{font-size:13px;color:var(--muted)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;padding:2px 9px;border-radius:6px;background:var(--surface2);color:var(--fg)}
.typing{display:inline-flex;gap:4px}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:b 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}
@media(prefers-reduced-motion:reduce){.typing span{animation:none}html{scroll-behavior:auto}}

/* docs */
.docgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@media(min-width:1000px){.docgrid{grid-template-columns:minmax(0,420px) minmax(0,1fr)}}
.paper{background:#fff;color:#1b1b1b;border:1px solid #d6d6d6;border-radius:4px;padding:34px 36px;font-family:'Times New Roman',Times,serif;font-size:14.5px;line-height:1.65;box-shadow:var(--shadow);max-height:760px;overflow:auto;position:relative}
.paper .p-title{font-size:19px;text-align:center;font-weight:700;text-decoration:underline;margin:0 0 14px;font-family:inherit;letter-spacing:.02em}
.paper .p-h{font-weight:700;margin:14px 0 4px;font-family:inherit;font-size:15px}
.paper p{margin:0 0 9px}
.paper .p-n{padding-left:22px;text-indent:-22px}
.paper .p-sig{text-align:right;margin-top:26px;white-space:pre-line}
.paper .p-sigs{display:flex;justify-content:space-between;gap:20px;margin-top:34px}
.paper .p-sigs div{white-space:pre-line}
.paper .p-note{font-style:italic;font-size:12.5px;color:#555}
.stamp{margin-top:18px;border:2px solid #8a1c1c;color:#8a1c1c;display:inline-block;padding:6px 12px;font-size:12px;font-family:var(--sans);font-weight:600;border-radius:4px;letter-spacing:.04em}
.track{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:14px 0}
.stp{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;font-size:12px;color:var(--muted);position:relative}
.stp .dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);border:2px solid var(--line);z-index:1}
.stp::before{content:"";position:absolute;top:14px;left:-50%;width:100%;height:2px;background:var(--line)}
.stp:first-child::before{display:none}
.stp.done{color:var(--fg)} .stp.done .dot{background:var(--good);border-color:var(--good);color:#fff}
.stp.done::before{background:var(--good)}
.stp.now .dot{border-color:var(--gold);background:var(--gold-soft);color:var(--gold-ink)}
.track.mini{margin:6px 0}

/* laws */
details.law{border:1px solid var(--line);border-radius:12px;background:var(--bg)}
details.law+details.law{margin-top:8px}
details.law summary{cursor:pointer;padding:13px 16px;display:flex;gap:12px;align-items:center;list-style:none;justify-content:space-between}
details.law summary::-webkit-details-marker{display:none}
details.law summary b{font-weight:600}
details.law[open] summary{border-bottom:1px solid var(--line)}
.ref{font-size:12px;font-weight:600;color:var(--gold-ink);background:var(--gold-soft);padding:2px 8px;border-radius:6px;white-space:nowrap;flex:none}
.lbody{padding:14px 16px;display:grid;gap:8px}
.old{font-size:12px;color:var(--muted)}
.helpline{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.helpline div{background:var(--surface);border-radius:10px;padding:10px 12px;font-size:13px}
.helpline b{font-family:var(--serif);font-size:19px;display:block}

/* dashboard */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{background:var(--surface);border-radius:12px;padding:14px}
.tile .v{font-family:var(--serif);font-size:28px;font-weight:600;line-height:1.1}
.tile .l{font-size:12px;color:var(--muted);margin-top:4px}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.row:last-child{border-bottom:0}
.row>div{min-width:0}
.cols{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;margin-top:16px}
@media(min-width:900px){.cols{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.yr{display:flex;align-items:flex-end;gap:14px;height:150px;padding-top:10px}
.yr div.c{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.yr .st{width:100%;max-width:44px;display:flex;flex-direction:column;justify-content:flex-end;flex:1}
.yr .w{background:var(--navy);border-radius:4px 4px 0 0}.yr .ls{background:var(--bad)}
.req{display:grid;gap:8px;margin:10px 0 0;padding:0;list-style:none;font-size:14px}
.req li{display:flex;gap:10px;align-items:flex-start}
.req .ok{color:var(--good)} .req .no{color:var(--muted)}
.meter{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-top:4px}
.meter span{display:block;height:100%;background:var(--gold)}

/* modal, toast */
.ov{position:fixed;inset:0;background:rgba(6,14,30,.6);z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:var(--bg);border-radius:16px;width:min(480px,100%);max-height:92vh;overflow:auto;padding:22px;display:grid;gap:14px;box-shadow:var(--shadow)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--hero1);color:#fff;padding:10px 16px;border-radius:10px;z-index:60;font-size:14px;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
footer{border-top:1px solid var(--line);margin-top:30px;padding-block:24px;color:var(--muted);font-size:13px}
.note{display:flex;gap:10px;padding:12px 14px;border-radius:10px;background:var(--gold-soft);color:var(--fg);font-size:13px;border:1px solid color-mix(in srgb,var(--gold) 35%,transparent)}
.note svg{flex:none;color:var(--gold-ink);margin-top:2px}
.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
.how{counter-reset:s}
.how .card{position:relative;padding-top:22px}
.stepno{position:absolute;top:-14px;left:16px;width:28px;height:28px;border-radius:50%;background:var(--gold);color:#0C1D3C;font-weight:700;display:grid;place-items:center;font-size:13px}
</style>

<div id="root">
  <header class="top"><div class="wrap bar">
    <a class="brand" href="#home"><span class="mark"><i data-lucide="scale"></i></span><span>Advonex</span></a>
    <nav id="nav" aria-label="Main"></nav>
    <div class="seg" role="group" aria-label="Demo role switcher">
      <button type="button" data-act="role" data-v="client" aria-pressed="true">View as Client</button>

function blocksToText(b){return b.map(x=>Array.isArray(x.x)?x.x.join('\n\n'):x.x).filter(Boolean).join('\n\n')}
function blocksToHtml(b){
  return b.map(x=>{
    const t=esc(x.t==='sigs'?'':x.x);
    switch(x.t){
      case 'title':return `<h3 class="p-title">${t}</h3>`;
      case 'h':return `<div class="p-h">${t}</div>`;
      case 'n':return `<p class="p-n">${t}</p>`;
      case 'sig':return `<div class="p-sig">${t}</div>`;
      case 'sigs':return `<div class="p-sigs">${x.x.map(s=>`<div>${esc(s)}</div>`).join('')}</div>`;
      case 'note':return `<p class="p-note">${t}</p>`;
      default:return `<p style="white-space:pre-line">${t}</p>`;}
  }).join('');
}
function makePdf(blocks,o){
  const J=window.jspdf&&window.jspdf.jsPDF;if(!J)return null;
  const d=new J({unit:'mm',format:'a4'});const M=20,TW=170;let y=24;
  const deco=()=>{
    if(o.draft){d.setTextColor(222);d.setFont('helvetica','bold');d.setFontSize(70);d.text('DRAFT',105,155,{align:'center',angle:38})}
    d.setTextColor(110);d.setFont('helvetica','normal');d.setFontSize(8);
    const ft=o.draft?'Draft generated on Advonex. Not verified, not stamped. Demo only.':`E-STAMP (SIMULATED) | Cert ${o.cert} | Digitally signed by ${o.by} | Demo only, not legally valid`;
    d.text(ft,105,288,{align:'center'});d.setTextColor(20);
  };
  const need=h=>{if(y+h>278){d.addPage();y=24;deco()}};
  deco();
  const LH=5.9;
  blocks.forEach(b=>{
    if(b.t==='title'){d.setFont('times','bold');d.setFontSize(15);need(14);d.text(b.x,105,y,{align:'center'});y+=11;return}
    if(b.t==='sigs'){d.setFont('times','normal');d.setFontSize(11.5);const ls=b.x.map(s=>s.split('\n'));const n=Math.max(...ls.map(a=>a.length));need(12+n*LH);y+=10;
      ls.forEach((a,i)=>a.forEach((l,j)=>d.text(l,i===0?M:130,y+j*LH)));y+=n*LH+4;return}
    if(b.t==='sig'){d.setFont('times','normal');d.setFontSize(11.5);const ls=b.x.split('\n');need(12+ls.length*LH);y+=12;ls.forEach((l,j)=>d.text(l,190,y+j*LH,{align:'right'}));y+=ls.length*LH+2;return}
    const bold=b.t==='h',ital=b.t==='note';
    d.setFont('times',bold?'bold':ital?'italic':'normal');d.setFontSize(ital?9.5:11.5);
    const lines=d.splitTextToSize(b.x,b.t==='n'?TW-6:TW);
    need(lines.length*LH+3);
    lines.forEach((l,i)=>{d.text(l,b.t==='n'&&i>0?M+6:M,y);y+=LH});y+=3;
  });
  return d.output('arraybuffer');
}
async function downloadPdf(blocks,o,name){
  const dl=await cap('downloads');
  if(!dl){toast('Saving files is not available in this view. Use Copy text instead.');return}
  const buf=makePdf(blocks,o);
  if(!buf){toast('The PDF engine did not load. Use Copy text instead.');return}
  try{await dl.save({filename:name,data:buf});toast('PDF saved')}catch(e){if(e&&e.code!=='declined')toast('Could not save the PDF in this view.')}
}
function copyText(t){
  const done=()=>toast('Copied to clipboard');
  const fb=()=>{try{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();done()}catch(e){toast('Copy is not available here')}};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(done,fb);else fb();
}

  steps:['Collect incorporation papers, shareholder or partnership agreements and the contracts in dispute.','Note dates of default, notices exchanged and any deadlines in the contract.','For brand disputes, find your trademark application or registration number.']}
};
function analyze(text){
  const t=' '+text.toLowerCase()+' ';
  let best=null,bs=0;
  Object.keys(KW).forEach(a=>{let s=0;KW[a].forEach(w=>{const hit=w.length<=4?new RegExp('\\b'+w+'\\b').test(t):t.includes(w);if(hit)s+=(w.length>3?2:1)});if(s>bs){bs=s;best=a}});
  let city=null;Object.keys(CITIES).forEach(c=>{if(new RegExp('\\b'+c+'\\b').test(t))city=CITIES[c]});
  let state=null;Object.keys(STATE_KW).forEach(c=>{if(t.includes(c))state=STATE_KW[c]});
  if(city){const l=LAW.find(x=>x.city===city);if(l)state=l.state}
  let court=null;
  if(/supreme\s*court|\bsc\b/.test(t))court='Supreme Court';
  else if(/high\s*court|\bhc\b/.test(t))court='High Court';
  else if(/district|sessions|magistrate|tehsil|family court|civil court/.test(t))court='District Court';
  const urg=/urgent|jaldi|immediate|emergency|kal\b|tomorrow|aaj|today|hearing|stay|warrant|summons|arrest|giraft|turant/.test(t)?'High':'Normal';
  const budget=/sasta|cheap|low budget|kam budget|budget kam|affordable|free|tight budget/.test(t);
  const hing=/\b(mere|mera|meri|hai|hain|mein|ka|ki|ke|kya|raha|rahi|upar|nahi|aur|karna|chahiye|mujhe|humare|bhejna|ho gaya)\b/.test(t);
  return {area:bs?best:null,city,state,court,urg,budget,hing};
}
function matchLawyers(a){
  return LAW.map(l=>{
    tierOf(l);let sc=0;const why=[];
    if(a.area){if(l.areas.includes(a.area)){sc+=40;why.push(`Practises ${a.area} law (${l.spec.toLowerCase()})`)}}else sc+=10;
    if(a.city&&l.city===a.city){sc+=25;why.push(`Based in ${l.city}`)}
    else if(a.state&&l.state===a.state){sc+=12;why.push(`Practises in ${l.state}`)}
    if(a.court){if(l.court===a.court){sc+=15;why.push(`Appears in the ${a.court}`)}else sc-=8}
    sc+=l.success*0.15;why.push(`${l.success}% success across ${l.cases} cases`);
    if(a.urg==='High'&&l.success>=80){sc+=8;if(l.chamber)sc+=2;why.push('Chamber and track record suit an urgent matter')}
    if(a.budget){if(l.fee<=1500){sc+=12;why.push(`Fee of ${inr(l.fee)} fits a tight budget`)}else if(l.fee>=5000)sc-=10}
    if(!a.court&&TIERS[tierOf(l)]&&tierOf(l)==='gold'&&a.urg==='Normal'&&!a.budget)why.push('Good for a first consultation or notice');
    return {l,sc:Math.max(0,Math.min(99,Math.round(sc))),why};
  }).sort((x,y)=>y.sc-x.sc).slice(0,3);
}
function matchCard(m,i){
  const l=m.l,t=tierOf(l);
  return `<div class="mcard"><div class="top2"><div><span class="rank">${i+1}</span><b>${esc(l.name)}</b></div>${tierBadge(t)}</div>

function botReply(text){
  const a=analyze(text);
  if(!a.area){
    return {html:`<p>${a.hing?'Thoda aur batayiye.':'Tell me a little more so I can match you well.'} What happened, in which city, and is it in a District Court, High Court or Supreme Court? For example: <i>"Property dispute in Indore district court, hearing next week."</i></p>`,a,picks:[]};
  }
  const c=CONTEXT[a.area];const picks=matchLawyers(a);
  const loc=[a.city||a.state,a.court].filter(Boolean).join(', ');
  const chips=`<div class="tags"><span class="tag"><b>Case type:</b> ${a.area}</span><span class="tag"><b>Location:</b> ${esc(loc||'not mentioned')}</span><span class="tag"><b>Urgency:</b> ${a.urg}</span>${a.budget?'<span class="tag"><b>Budget:</b> tight</span>':''}</div>`;
  const intro=a.hing?`Samajh gaya. Yeh <b>${c.title}</b> lag raha hai. Neeche basic legal context aur aapke liye top 3 lawyers hain.`:`This looks like a <b>${c.title.toLowerCase()}</b>. Here is the basic legal context and the three best-matching advocates on the platform.`;
  const html=`<p>${intro}</p>${chips}<p>${esc(c.txt)}</p><p class="small muted"><b>Relevant laws:</b> ${esc(c.laws)}</p><div><b>${a.hing?'Aap abhi yeh kar sakte hain':'What you can do now'}</b><ul>${c.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ul></div><h4>${a.hing?'Top 3 matching lawyers':'Top 3 matching lawyers'}</h4>${picks.map(matchCard).join('')}<p class="tiny muted">General information, not legal advice. Match scores combine practice area, location, court, success rate, urgency and budget.</p>`;
  return {html,a,picks};
}

async function sendChat(text){
  text=text.trim();if(!text)return;
  ensureChat();
  if(S.cur.title==='New chat')S.cur.title=text.length>60?text.slice(0,58)+'…':text;
  S.cur.msgs.push({role:'user',html:'<p>'+esc(text)+'</p>'});

  renderLog();persistChat();

async function claudeExplain(text,r){
  const sample=await cap('sample');
  const id='ai'+uid();
  if(!sample){S.cur.msgs.push({role:'bot',html:'<p class="small muted">Claude explanations are not available in this view.</p>'});renderLog();return}
  S.cur.msgs.push({role:'bot',id,html:'<span class="typing"><span></span><span></span><span></span></span> Claude is writing…',tmp:1});renderLog();
  const picks=r.picks.map(p=>`${p.l.name} (${tierOf(p.l).toUpperCase()} tier, ${p.l.success}% success, ${p.l.venue})`).join('; ');
  const prompt=`You are a careful legal-information assistant for Indian citizens. A person wrote: "${text}"\nDetected: case type ${r.a.area}, location ${r.a.city||r.a.state||'unknown'}, court ${r.a.court||'unknown'}, urgency ${r.a.urg}.\nMatched advocates: ${picks}.\nIn under 130 words, explain in simple language what their situation likely involves under current Indian law (note that BNS, BNSS and BSA replaced IPC, CrPC and the Evidence Act from 1 July 2024), what to prepare before a consultation, and one deadline or risk to watch. Reply in Hinglish if the person wrote in Hinglish, otherwise English. Do not promise outcomes. Plain text, no markdown.`;
  try{
    const res=await sample(prompt,{cache:false,modelTier:'default',onText:({text:t})=>{const el=document.getElementById(id);if(el)el.innerHTML='<p style="white-space:pre-line"><b>Claude\'s explanation</b>\n'+esc(t)+'</p>'}});
    S.cur.msgs=S.cur.msgs.filter(m=>m.id!==id);
    S.cur.msgs.push({role:'bot',html:'<p style="white-space:pre-line"><b>Claude\'s explanation</b>\n'+esc(res.text)+'</p><p class="tiny muted">AI-generated general information, not legal advice.</p>'});
    persistChat();
  }catch(e){
    S.cur.msgs=S.cur.msgs.filter(m=>m.id!==id);
    const why=e&&e.code==='not_granted'?'Permission was not given.':e&&e.code==='rate_limited'?'Too many requests right now. Try again later.':'Something went wrong.';
    S.cur.msgs.push({role:'bot',html:`<p class="small muted">Claude explanation skipped. ${why}</p>`});
  }
  renderLog();
}

  <p class="tiny muted" style="margin-top:10px">In the demo you can advance the steps yourself here, or switch to <b>View as Lawyer</b> and verify and stamp the document from the lawyer dashboard.${d.cert?' Certificate no. '+esc(d.cert)+' (simulated).':''}</p>`;
  icons();
}
function viewDocsInit(){renderDocForm();renderPaper();renderWorkflow();icons()}
function finalPdf(d){
  const blocks=DOCS[d.type].build(d.vals);
  downloadPdf(blocks,{draft:false,cert:d.cert,by:d.by||me().name},d.type+'-stamped.pdf');
}

function viewLaws(){
  return `<div class="wrap"><div class="page-h"><h1>Indian law & Constitution</h1><p>Plain-language summaries of the Constitution, the new criminal codes and everyday laws. Search by topic, section or keyword.</p></div>
  <div class="card" style="margin-block:14px"><label class="f">Search laws and rights<input type="search" id="lq" placeholder="Try: arrest, bail, divorce, rent, consumer, 138, FIR" value="${esc(S.lq||'')}"></label><div class="chips" style="margin-top:12px" id="lcats"></div></div>
  <div class="helpline" style="margin-bottom:16px"><div><b>112</b>Police, fire, ambulance</div><div><b>15100</b>Free legal aid (NALSA)</div><div><b>181</b>Women helpline</div><div><b>1930</b>Cyber financial fraud</div></div>
  <div class="note" style="margin-bottom:16px"><i data-lucide="info"></i><span>The BNS, BNSS and BSA replaced the IPC, CrPC and Evidence Act for offences from 1 July 2024. Older cases continue under the old codes. Section numbers below show the earlier equivalent.</span></div>
  <div id="lresults"></div></div>`;
}
function updateLaws(){
  const q=(S.lq||'').trim().toLowerCase(),c=S.lcat||'all';
  const rs=LAWS.filter(x=>(c==='all'||x.c===c)&&(!q||(x.r+' '+x.t+' '+x.s+' '+x.k+' '+(x.o||'')).toLowerCase().includes(q)));
  $('#lcats').innerHTML=CATS.map(k=>`<button class="chip" data-act="lcat" data-v="${k[0]}" aria-pressed="${k[0]===c}">${k[1]}</button>`).join('');
  $('#lresults').innerHTML=(rs.length?rs.map(x=>`<details class="law"><summary><span><b>${esc(x.t)}</b></span><span class="ref">${esc(x.r)}</span></summary><div class="lbody"><p>${esc(x.s)}</p>${x.o?`<div class="old">${esc(x.o)}</div>`:''}</div></details>`).join(''):'<div class="empty">Nothing matches that search. Try a shorter keyword like "bail" or "rent".</div>');
  icons();
}

function viewDashboard(){return S.role==='client'?dashClient():dashLawyer()}
function dashClient(){
  const up=S.bookings.filter(b=>b.status!=='Cancelled');
  return `<div class="wrap"><div class="page-h"><div class="pill" style="margin-bottom:8px">Client view · Riya Sharma</div><h1>Your dashboard</h1></div>
  <div class="tiles" style="margin-block:14px"><div class="tile"><div class="v">${up.length}</div><div class="l">Booked consultations</div></div><div class="tile"><div class="v">${S.chats.length}</div><div class="l">AI chats</div></div><div class="tile"><div class="v">${S.docs.length}</div><div class="l">Documents</div></div><div class="tile"><div class="v">${S.docs.filter(d=>d.status===3).length}</div><div class="l">Ready to download</div></div></div>
  <div class="cols"><div class="card"><h3 style="font-size:18px">Consultations</h3>${S.bookings.length?S.bookings.map(b=>{const l=lawyer(b.lid);return `<div class="row"><div><b>${esc(l.name)}</b> ${tierBadge(tierOf(l))}<div class="small muted">${fmtS(b.date)} · ${b.slot} · ${esc(b.mode)}</div></div><div style="display:flex;gap:8px;align-items:center"><span class="pill ${b.status==='Confirmed'?'good':'bad'}">${b.status}</span>${b.status==='Confirmed'?`<button class="btn btn-sm" data-act="cancel" data-id="${b.id}">Cancel</button>`:''}</div></div>`}).join(''):'<div class="empty" style="margin-top:10px">No consultations yet. <a href="#lawyers">Browse lawyers</a> to book one.</div>'}</div>
  <div class="card"><h3 style="font-size:18px">AI chat history</h3>${S.chats.length?S.chats.map(c=>`<div class="row"><div><b>${esc(c.title)}</b><div class="small muted">${fmtS(c.date)} · ${c.msgs.filter(m=>m.role==='user').length} message(s)</div></div><button class="btn btn-sm" data-act="openchat" data-id="${c.id}">Open</button></div>`).join(''):'<div class="empty" style="margin-top:10px">No chats yet. <a href="#matcher">Ask the AI matcher</a>.</div>'}</div></div>
  <div class="card" style="margin-top:16px"><h3 style="font-size:18px">Your documents</h3>${S.docs.length?S.docs.map(d=>`<div class="row" style="align-items:flex-start"><div style="flex:1 1 320px"><b>${esc(docTitle(d))}</b><div class="small muted">Created ${fmtS(d.created)}</div>${tracker(d.status,1)}</div><div style="display:flex;gap:8px;flex-wrap:wrap">${d.status===3?`<button class="btn btn-sm btn-gold" data-act="final" data-id="${d.id}"><i data-lucide="download"></i>Download PDF</button>`:`<button class="btn btn-sm" data-act="draftpdf" data-id="${d.id}"><i data-lucide="download"></i>Draft PDF</button>`}</div></div>`).join(''):'<div class="empty" style="margin-top:10px">No documents yet. <a href="#docs">Create one</a>.</div>'}</div></div>`;
}
function nextTier(l){
  const t=tierOf(l),i=TIER_ORDER.indexOf(t);if(i===3)return null;
  const n=TIER_ORDER[i+1];
  const req=n==='platinum'?[['Experience of 3+ years',l.exp>=3,Math.min(100,l.exp/3*100),l.exp+' of 3 years']]:n==='diamond'?[['Experience of 7+ years',l.exp>=7,Math.min(100,l.exp/7*100),l.exp+' of 7 years'],['Owns an official court chamber',l.chamber,l.chamber?100:0,l.chamber?'Yes':'No'],['Success rate of 80%+',l.success>=80,Math.min(100,l.success/80*100),l.success+'% of 80%']]:[['Experience of 10+ years',l.exp>=10,Math.min(100,l.exp/10*100),l.exp+' of 10 years'],['Owns an official court chamber',l.chamber,l.chamber?100:0,l.chamber?'Yes':'No'],['Success rate of 95%+',l.success>=95,Math.min(100,l.success/95*100),l.success+'% of 95%']];
  return {n,req};
}
function dashLawyer(){
  const l=me(),t=tierOf(l),losses=l.cases-l.wins,nt=nextTier(l);
  const yrs=Object.keys(S.yr);const mx=Math.max(...yrs.map(y=>S.yr[y][0]+S.yr[y][1]));
  const queue=S.docs.filter(d=>d.status<3);
  const leads=S.leads.filter(x=>x.st==='new'),acc=S.leads.filter(x=>x.st==='accepted');
  return `<div class="wrap"><div class="page-h"><div class="pill" style="margin-bottom:8px">Lawyer view · ${esc(l.name)}</div><h1>Practice dashboard</h1></div>
  <div class="tiles" style="margin-block:14px"><div class="tile"><div class="v num">${l.cases}</div><div class="l">Cases handled</div></div><div class="tile"><div class="v num" style="color:var(--good)">${l.wins}</div><div class="l">Won</div></div><div class="tile"><div class="v num" style="color:var(--bad)">${losses}</div><div class="l">Lost</div></div><div class="tile"><div class="v num">${l.success}%</div><div class="l">Success rate</div></div><div class="tile"><div class="v num">${leads.length}</div><div class="l">New AI leads</div></div></div>
  <div class="cols">
   <div class="card"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><div class="lwho"><span class="av">${initials(l.name)}</span><div><h3 style="font-size:18px">${esc(l.name)}</h3><div class="bci small muted">Bar Council ID ${esc(l.bci)}</div></div></div>${tierBadge(t)}</div>
    <h4 style="font-size:15px;margin-top:16px">Manage profile</h4>
    <div class="fgrid" style="margin-top:8px"><label class="f">Consultation fee (Rs.)<input type="number" id="pfee" value="${l.fee}" data-prof="fee"></label><label class="f">Availability<select id="pav" data-prof="avail"><option value="1" ${S.avail?'selected':''}>Accepting new clients</option><option value="0" ${!S.avail?'selected':''}>Not available</option></select></label><label class="f full">Short bio<textarea id="pbio" data-prof="bio" rows="3">${esc(S.bio)}</textarea></label></div>
    <p class="tiny muted" style="margin-top:8px">${esc(l.venue)} · ${esc(l.areas.join(', '))} · Chamber: ${l.chamber?'Yes':'No'}. Changes save automatically and show on your directory card.</p></div>
   <div class="card"><h3 style="font-size:18px">Tier progress</h3>
    ${nt?`<p class="small muted" style="margin-top:4px">Requirements for <b>${TIERS[nt.n].name}</b> tier</p><ul class="req">${nt.req.map(r=>`<li><span class="${r[1]?'ok':'no'}"><i data-lucide="${r[1]?'check-circle-2':'circle'}"></i></span><div style="flex:1"><div>${r[0]} <span class="muted small">(${r[3]})</span></div><div class="meter"><span style="width:${r[2]}%"></span></div></div></li>`).join('')}</ul>`:`<p class="small muted" style="margin-top:6px">You are in the top tier. Keep the success rate at 95% or above to stay Elite.</p>`}
    <h4 style="font-size:15px;margin-top:16px">Log a case outcome</h4><p class="small muted">Results change your success rate, which decides tier upgrades and downgrades.</p>
    <div class="chips" style="margin-top:8px"><button class="btn btn-sm" data-act="win"><i data-lucide="trending-up"></i>Record a win</button><button class="btn btn-sm" data-act="loss"><i data-lucide="trending-down"></i>Record a loss</button></div></div>
  </div>
  <div class="card" style="margin-top:16px"><h3 style="font-size:18px">Wins and losses by year</h3><div class="yr" role="img" aria-label="Wins and losses per year">${yrs.map(y=>{const [w,x]=S.yr[y];return `<div class="c"><span class="tiny muted num">${w}/${x}</span><div class="st" style="min-height:0;height:${(w+x)/mx*100}%;flex:none"><div class="ls" style="height:${x/(w+x)*100}%"></div><div class="w" style="height:${w/(w+x)*100}%"></div></div><span class="tiny muted">${y}</span></div>`}).join('')}</div><div class="tiny muted" style="margin-top:8px"><span style="color:var(--navy)">■</span> Won <span style="color:var(--bad);margin-left:10px">■</span> Lost</div></div>
  <div class="cols"><div class="card"><h3 style="font-size:18px">Incoming leads matched by AI</h3>${leads.length?leads.map(x=>`<div class="row" style="align-items:flex-start"><div style="flex:1 1 240px"><b>${esc(x.client)}</b> · ${esc(x.city)} <span class="pill ${x.urg==='High'?'warn':''}">${x.urg}</span><div class="small muted" style="margin-top:2px">${esc(x.area)}: ${esc(x.text)}</div><div class="tiny" style="margin-top:4px">AI match <b>${x.match}%</b></div></div><div style="display:flex;gap:6px"><button class="btn btn-sm btn-primary" data-act="lead" data-id="${x.id}" data-v="accepted">Accept</button><button class="btn btn-sm" data-act="lead" data-id="${x.id}" data-v="declined">Decline</button></div></div>`).join(''):'<div class="empty" style="margin-top:10px">No new leads right now.</div>'}${acc.length?`<h4 style="font-size:14px;margin-top:14px">Accepted</h4>${acc.map(x=>`<div class="row"><div><b>${esc(x.client)}</b> · ${esc(x.area)}</div><span class="pill good">Accepted</span></div>`).join('')}`:''}</div>
  <div class="card"><h3 style="font-size:18px">Client documents to verify</h3>${queue.length?queue.map(d=>`<div class="row" style="align-items:flex-start"><div style="flex:1 1 220px"><b>${esc(docTitle(d))}</b><div class="small muted">${STAGES[d.status]}</div>${tracker(d.status,1)}</div><button class="btn btn-sm btn-primary" data-act="adv" data-id="${d.id}"><i data-lucide="stamp"></i>${d.status===0?'Verify':d.status===1?'E-stamp & sign':'Release'}</button></div>`).join(''):'<div class="empty" style="margin-top:10px">Nothing waiting. Documents sent by clients appear here.</div>'}</div></div></div>`;
}

/* ---------- booking modal ---------- */
function openBook(id){
  const l=lawyer(id),t=tierOf(l);
  const modes=['Video call','Phone call'].concat(l.chamber?['In chamber']:[]);
  $('#modal').innerHTML=`<div class="ov" data-act="closem"><div class="modal" role="dialog" aria-modal="true" aria-label="Book consultation" id="mbox">
   <div style="display:flex;justify-content:space-between;gap:10px"><div><h3 style="font-size:20px">Book consultation</h3><div class="small muted" style="margin-top:2px">${esc(l.name)} · ${esc(l.venue)}</div></div><button class="btn btn-sm" data-act="closem" aria-label="Close"><i data-lucide="x"></i></button></div>
   <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">${tierBadge(t)}<span class="pill">${l.success}% success</span><b class="num" style="margin-left:auto">${inr(l.fee)}</b></div>
   <div class="fgrid"><label class="f">Date<input type="date" id="bdate" min="${addDays(TODAY,1)}" value="${addDays(TODAY,2)}"></label><label class="f">Time slot<select id="bslot"><option>10:00</option><option>11:30</option><option>15:00</option><option>17:30</option></select></label><label class="f full">Mode<select id="bmode">${modes.map(m=>`<option>${m}</option>`).join('')}</select></label><label class="f full">What is it about?<textarea id="bnote" rows="3" placeholder="One or two lines about your matter"></textarea></label></div>
   <button class="btn btn-gold" data-act="confirmbook" data-id="${l.id}">Confirm booking</button><p class="tiny muted">Demo only. No payment is taken.</p></div></div>`;
  icons();
}

/* ---------- main render ---------- */
function render(){
  const r=route();renderNav();const v=$('#view');
  if(r==='home')v.innerHTML=viewHome();
  else if(r==='lawyers'){v.innerHTML=viewLawyers();updateLawyers()}
  else if(r==='matcher'){v.innerHTML=viewMatcher();ensureChat();renderLog()}
  else if(r==='docs'){v.innerHTML=viewDocs();viewDocsInit()}
  else if(r==='laws'){v.innerHTML=viewLaws();updateLaws()}
  else v.innerHTML=viewDashboard();
  icons();
}
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,id=el.dataset.id,v=el.dataset.v;
  if(a==='closem'){if(e.target===el||el.tagName==='BUTTON'){$('#modal').innerHTML=''}return}
  switch(a){
   case 'role':S.role=v;location.hash==='#dashboard'?render():(location.hash='#dashboard');break;
   case 'tier':S.f.tier=v;if(route()==='lawyers')updateLawyers();else{location.hash='#lawyers'}break;
   case 'clearf':S.f={q:'',state:'',city:'',court:'',area:'',tier:'',sort:'tier'};render();break;
   case 'book':openBook(Number(id));break;
   case 'confirmbook':{
     const date=$('#bdate').value||addDays(TODAY,2);
     S.bookings.unshift({id:'b'+uid(),lid:Number(id),date,slot:$('#bslot').value,mode:$('#bmode').value,note:$('#bnote').value,status:'Confirmed'});
     save();$('#modal').innerHTML='';toast('Consultation booked for '+fmtS(date)+'. See it in your Dashboard.');break;}
   case 'cancel':{const b=S.bookings.find(x=>x.id===id);if(b){b.status='Cancelled';save();render()}break;}
   case 'ex':sendChat(el.dataset.t);break;
   case 'newchat':S.cur=null;ensureChat();renderLog();break;
   case 'openchat':{const c=S.chats.find(x=>x.id===id);if(c){S.cur=c;location.hash='#matcher';render()}break;}
   case 'doctype':S.docType=v;render();break;
   case 'dcopy':copyText(blocksToText(DOCS[S.docType].build(S.docForm[S.docType])));break;
   case 'dpdf':downloadPdf(DOCS[S.docType].build(S.docForm[S.docType]),{draft:true},S.docType+'-draft.pdf');break;
   case 'dsubmit':{
     const d={id:'d'+uid(),type:S.docType,vals:Object.assign({},S.docForm[S.docType]),status:0,created:TODAY};
     S.docs.unshift(d);S.curDoc=d.id;save();renderWorkflow();toast('Sent for advocate verification');$('#wf').scrollIntoView({behavior:'smooth',block:'center'});break;}
   case 'adv':{const d=S.docs.find(x=>x.id===id);if(d){advance(d);toast(STAGES[d.status]);render()}break;}
   case 'final':{const d=S.docs.find(x=>x.id===id);if(d)finalPdf(d);break;}
   case 'draftpdf':{const d=S.docs.find(x=>x.id===id);if(d)downloadPdf(DOCS[d.type].build(d.vals),{draft:true},d.type+'-draft.pdf');break;}
   case 'lcat':S.lcat=v;updateLaws();break;
   case 'lead':{const x=S.leads.find(q=>q.id===id);if(x){x.st=v;save();render();toast(v==='accepted'?'Lead accepted. The client will be notified.':'Lead declined')}break;}
   case 'win':case 'loss':{
     const l=me(),before=tierOf(l),y=new Date().getFullYear();
     if(!S.yr[y])S.yr[y]=[0,0];
     l.cases++;if(a==='win'){l.wins++;S.yr[y][0]++}else S.yr[y][1]++;
     l.success=Math.round(l.wins/l.cases*1000)/10;
     const after=tierOf(l);save();render();
     toast(after!==before?`Tier changed: ${TIERS[before].name} to ${TIERS[after].name}`:`Outcome recorded. Success rate is now ${l.success}%`);break;}
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.bind){S.f[t.dataset.bind]=t.value;if(t.dataset.bind==='state'){S.f.city='';const c=$('#fcity');if(c)c.innerHTML=selOpts(cityOptions(),'','All cities')}updateLawyers()}
  else if(t.dataset.doc){S.docForm[S.docType][t.dataset.doc]=t.value;save();if(t.dataset.rr){renderDocForm()}renderPaper()}
  else if(t.id==='lq'){S.lq=t.value;updateLaws()}
  else if(t.dataset.prof){const l=me(),k=t.dataset.prof;if(k==='fee')l.fee=Math.max(0,Number(t.value)||0);else if(k==='avail')S.avail=t.value==='1';else S.bio=t.value;save()}
  else if(t.id==='assist'){S.assist=t.checked}
});
document.addEventListener('change',e=>{if(e.target.id==='assist')S.assist=e.target.checked});
document.addEventListener('submit',e=>{
  if(e.target.id==='cform'){e.preventDefault();const i=$('#cin');const v=i.value;i.value='';sendChat(v)}
});
document.addEventListener('keydown',e=>{
  if(e.target.id==='cin'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();const v=e.target.value;e.target.value='';sendChat(v)}
  if(e.key==='Escape')$('#modal').innerHTML='';
});

render();
})();
</script>

</body></html>
